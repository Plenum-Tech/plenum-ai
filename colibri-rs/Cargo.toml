[package]
name = "colibri-rs"
version = "0.1.0"
edition = "2021"
description = "colibri in Rust: a CPU engine that runs GGUF language models in place, with disk expert-streaming for MoE"
license = "Apache-2.0"
authors = ["Plenum Tech"]
repository = "https://github.com/Plenum-Tech/colibri-memorilla-rs"

[[bin]]
name = "coli-rs"
path = "src/main.rs"

[lib]
name = "colibri"
path = "src/lib.rs"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
fancy-regex = "0.14"
serde_json = "1"

