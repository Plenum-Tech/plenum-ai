[package]
name = "plenum-engine"
version = "0.1.0"
edition = "2021"
description = "Plenum Engine: a CPU engine that runs GGUF language models in place, with disk expert-streaming for MoE"
license = "Apache-2.0"
authors = ["Plenum Tech"]
repository = "https://github.com/Plenum-Tech/plenum-ai"

[[bin]]
name = "plenum-engine"
path = "src/main.rs"

[lib]
name = "plenum_engine"
path = "src/lib.rs"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
fancy-regex = "0.14"
serde_json = "1"

